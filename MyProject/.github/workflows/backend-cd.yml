name: Backend CD

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: MyProject

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myproject_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: MyProject/global.json

      - name: Test
        run: dotnet test src/Backend/MyProject.slnx --configuration Release
        env:
          ConnectionStrings__Default: >-
            Host=localhost;Port=5432;Database=myproject_test;Username=postgres;Password=postgres

  publish:
    name: Build and push images
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - path: src/Backend/Host.Api
            name: host-api
          - path: src/Backend/ApiGateway
            name: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=latest" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: MyProject
          file: MyProject/${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

  summary:
    name: CD summary
    needs: [test, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Result
        run: |
          if [ "${{ needs.publish.result }}" = "success" ]; then
            echo "✅ Images published to ${{ env.REGISTRY }}"
          else
            echo "❌ CD failed"
            exit 1
          fi
