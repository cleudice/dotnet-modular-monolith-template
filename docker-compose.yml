name: modular-monolith

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myproject
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  host-api:
    build:
      context: MyProject
      dockerfile: MyProject/src/Backend/Host.Api/Dockerfile
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=myproject;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: MyProject
      dockerfile: MyProject/src/Backend/ApiGateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__host-api__Destinations__host-api-dest__Address: http://host-api:5100/
    depends_on:
      - host-api

volumes:
  postgres-data:
